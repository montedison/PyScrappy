name: Sync Upstream PyScrappy

on:
  schedule:
    # Si esegue ogni 6 ore per controllare aggiornamenti
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permette l'avvio manuale per test

jobs:
  sync_upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessario per fare il push nel tuo fork

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          # Questo assicura che l'azione lavori sul tuo repository
          fetch-depth: 0

      - name: Config Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"

      - name: Add Upstream Remote
        run: git remote add upstream https://github.com/mldsveda/PyScrappy.git

      - name: Fetch Upstream
        run: git fetch upstream

      - name: Merge Upstream Changes
        id: merge_check
        run: |
          # Tenta di unire i cambiamenti dell'originale nel tuo fork
          if git merge upstream/main --no-edit; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "Changes merged successfully."
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "Merge conflict detected! Manual intervention required."
            exit 1
          fi

      - name: Push Changes to Fork
        if: steps.merge_check.outputs.status == 'success'
        run: git push origin main
