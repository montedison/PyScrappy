services:
  # --- IL MUSCOLO: Scraper MCP (Sidecar) ---
  pyscrappy-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pyscrappy_mcp
    restart: unless-stopped
    networks:
      - dokploy-network # Si connette alla rete dove sta il backend
    environment:
      - PYTHONUNBUFFERED=1
      - PYSCRAPPY_MCP_CACHE_TTL=300
    volumes:
      - pyscrappy_data:/root/.cache/pyscrappy

volumes:
  # Gestiamo solo il volume specifico del sidecar
  pyscrappy_data:
    name: pyscrappy_mcp_data
    external: true

networks:
  # Dichiariamo che la rete esiste già (gestita da Dokploy)
  dokploy-network:
    external: true
