services:
  pyscrappy-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pyscrappy_mcp
    restart: always  # Forza il riavvio se crasha
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - unsloth-net    # <--- CRUCIALE: Deve essere la stessa rete di Unsloth
    volumes:
      - pyscrappy_data:/root/.cache/pyscrappy

volumes:
  pyscrappy_data:
    name: pyscrappy_mcp_data

networks:
  unsloth-net:
    external: true
