services:
  # --- IL CUORE: Motore AI ---
  unsloth-backend:
    image: unsloth-amd:latest # Assicurati che l'immagine sia disponibile localmente o su un registry
    container_name: unsloth_rocm_backend
    restart: unless-stopped
    networks:
      - dokploy-network
    ports:
      - "8888:8888"   # Jupyter
      - "8005:8005"   # Unsloth Studio (Porta esterna)
    volumes:
      - unsloth_data:/workspace/work
      - unsloth_studio_data:/workspace/studio
      - ./custom_templates:/workspace/templates:ro

  # --- IL MUSCOLO: Scraper MCP ---
  pyscrappy-mcp:
    build:
      context: .
      dockerfile: Dockerfile # Il Dockerfile che abbiamo ottimizzato prima
    container_name: pyscrappy_mcp
    restart: unless-stopped
    networks:
      - dokploy-network
    # Non servono porte esposte all'esterno perché comunicherà solo con Unsloth internamente
    environment:
      - PYTHONUNBUFFERED=1
      - PYSCRAPPY_MCP_CACHE_TTL=300

volumes:
  unsloth_data:
    name: unsloth_backend_data
    external: true
  unsloth_studio_data:
    name: unsloth_studio_data
    external: true
